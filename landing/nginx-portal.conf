server {
    listen 80 default_server;
    server_name _;
    root /opt/portal;
    index index.html;

    # 旧文章里的图片/附件仍走 80 时，转发到 8080 的 WordPress，避免图片失效
    location ~ ^/(wp-content|wp-includes)/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
