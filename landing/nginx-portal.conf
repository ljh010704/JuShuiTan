# 把项目导航放到 http://117.72.39.12/nav/ （可选方案，不影响 WordPress）
# 用法：将本文件复制到 /etc/nginx/conf.d/portal.conf 后执行 sudo nginx -t && sudo nginx -s reload
server {
    listen 80;
    server_name _;

    location = /nav { return 301 /nav/; }
    location /nav/ {
        alias /opt/portal/;
        index index.html;
    }
}
